version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: botpassword
      POSTGRES_DB: botdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - bot_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - bot_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://botuser:botpassword@postgres:5432/botdb
      REDIS_URL: redis://redis:6379
      ADMIN_API_KEY: ${ADMIN_API_KEY:-admin123}
      PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bot_network

  dashboard:
    build: ./dashboard
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://botuser:botpassword@postgres:5432/botdb
      API_URL: http://api:8000
      SECRET_KEY: ${DASHBOARD_SECRET_KEY:-supersecretkey}
      PORT: 5000
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - bot_network

  bot:
    build: ./bot
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      API_URL: http://api:8000
      BOT_PREFIX: ${BOT_PREFIX:-!}
      OWNER_IDS: ${OWNER_IDS}
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - bot_network

volumes:
  postgres_data:

networks:
  bot_network:
    driver: bridge
