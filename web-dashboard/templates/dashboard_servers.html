{% extends "base.html" %}

{% block title %}Servers - Family Game Store Bot{% endblock %}

{% block content %}
<section class="py-8">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-white">Your Servers</h1>
            <button onclick="openAddServerModal()" class="bg-purple-600 px-4 py-2 rounded-lg hover:bg-purple-700">
                <i class="fas fa-plus mr-2"></i> Add Server
            </button>
        </div>
        
        <div id="serversList" class="space-y-4">
            <!-- Servers will be loaded here -->
        </div>
    </div>
</section>

<!-- Add Server Modal -->
<div id="addServerModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="text-xl font-bold">Add Server</h3>
            <span class="close">&times;</span>
        </div>
        <form id="addServerForm">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Server ID</label>
                    <input type="text" name="server_id" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Server Name</label>
                    <input type="text" name="server_name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Server Icon URL</label>
                    <input type="text" name="server_icon" class="form-control">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('addServerModal')">Cancel</button>
                <button type="submit" class="btn btn-primary">Add Server</button>
            </div>
        </form>
    </div>
</div>

<script>
async function loadServers() {
    const response = await fetch('/api/servers');
    const servers = await response.json();
    renderServersList(servers);
}

function renderServersList(servers) {
    const container = document.getElementById('serversList');
    if (!servers || servers.length === 0) {
        container.innerHTML = '<div class="text-center py-8"><p class="text-gray-400">No servers found</p></div>';
        return;
    }
    
    container.innerHTML = servers.map(server => `
        <div class="bg-gray-800 rounded-lg p-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    ${server.icon ? `<img src="${server.icon}" class="w-10 h-10 rounded-full">` :
                        `<div class="w-10 h-10 bg-purple-600 rounded-full flex items-center justify-center">
                            <i class="fas fa-hashtag text-white"></i>
                        </div>`}
                    <div>
                        <h3 class="font-semibold">${escapeHtml(server.name)}</h3>
                        <p class="text-sm text-gray-400">ID: ${server.server_id}</p>
                    </div>
                </div>
                <div>
                    ${server.license_key ? 
                        `<span class="badge badge-success">Premium</span>` :
                        `<button onclick="openActivateLicenseModal('${server.server_id}')" 
                            class="btn btn-sm btn-primary">Activate License</button>`
                    }
                </div>
            </div>
            ${server.license_key ? `
            <div class="mt-4 pt-4 border-t border-gray-700 grid grid-cols-3 gap-4">
                <div>
                    <p class="text-xs text-gray-400">License Key</p>
                    <p class="text-sm font-mono">${server.license_key}</p>
                </div>
                <div>
                    <p class="text-xs text-gray-400">Expires</p>
                    <p class="text-sm">${server.expires || 'Never'}</p>
                </div>
                <div>
                    <p class="text-xs text-gray-400">Plan</p>
                    <p class="text-sm">${server.plan || 'Premium'}</p>
                </div>
            </div>
            ` : ''}
        </div>
    `).join('');
}

document.getElementById('addServerForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData.entries());
    
    const response = await fetch('/api/add-server', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    const result = await response.json();
    
    if (result.success) {
        closeModal('addServerModal');
        loadServers();
        showToast('Server added!', 'success');
    } else {
        showToast(result.error, 'error');
    }
});

loadServers();
</script>
{% endblock %}
