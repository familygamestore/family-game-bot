{% extends "base.html" %}

{% block title %}Login - Family Game Store Bot{% endblock %}

{% block content %}
<section class="py-16">
    <div class="container mx-auto px-4 max-w-md">
        <div class="bg-gray-800 rounded-xl p-8">
            <h1 class="text-2xl font-bold text-white text-center mb-6">Login to Your Account</h1>
            
            <form method="POST">
                <div class="mb-4">
                    <label class="block text-gray-300 mb-2">Email</label>
                    <input type="email" name="email" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-purple-500">
                </div>
                <div class="mb-6">
                    <label class="block text-gray-300 mb-2">Password</label>
                    <input type="password" name="password" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-purple-500">
                </div>
                <button type="submit" class="w-full bg-purple-600 py-3 rounded-lg font-semibold hover:bg-purple-700 transition">
                    Login
                </button>
            </form>
            
            <p class="text-center text-gray-400 mt-6">
                Don't have an account? <a href="/register" class="text-purple-400 hover:underline">Register</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
